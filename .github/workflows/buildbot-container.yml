name: Build Buildbot Container

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/buildbot-container.yml
      - buildbot/Dockerfile
      - buildbot/build_tflite.sh
      - Pipfile
      - Pipfile.lock.3.10
      - Pipfile.lock.3.11
      - versioned_pipenv
  pull_request:
    paths:
      - .github/workflows/buildbot-container.yml
      - buildbot/Dockerfile
      - buildbot/build_tflite.sh
      - Pipfile
      - Pipfile.lock.3.10
      - Pipfile.lock.3.11
      - versioned_pipenv
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-26.04
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}/mlgo-buildbot-deps
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build container image
        run: |
          docker build \
            -f buildbot/Dockerfile \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" \
            -t "${IMAGE_NAME}:latest" \
            .

      - name: Verify container dependencies
        run: |
          docker run --rm "${IMAGE_NAME}:latest" bash -ec '
            test -s /tflite/tflite.cmake
            buildbot-worker --version
            clang --version
            cmake --version
            ninja --version
            ccache --version
            python3 -c "import os, tensorflow as tf; assert os.path.isdir(os.path.join(os.path.dirname(tf.__file__), \"xla_aot_runtime_src\"))"
          '

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.repository == 'google/ml-compiler-opt'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push container image to ghcr.io
        if: github.event_name != 'pull_request' && github.repository == 'google/ml-compiler-opt'
        run: |
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:latest"
